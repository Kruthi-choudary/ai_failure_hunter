[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-failure-hunter"
version = "0.1.0"
description = "Minimal AI-assisted failure discovery for Python functions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<2",
  "hypothesis>=6.0,<7",
  "pydantic>=2.7,<3",
  "streamlit>=1.40,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
include = ["failure_hunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

